<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				function readCookie(name) {
					var prefix = name + '=';
					var parts = document.cookie.split(';');
					for (var i = 0; i < parts.length; i += 1) {
						var trimmed = parts[i].trim();
						if (trimmed.indexOf(prefix) === 0) return decodeURIComponent(trimmed.slice(prefix.length));
					}
					return null;
				}
				try {
					var raw = localStorage.getItem('employee-portal-settings');
					var settings = raw ? JSON.parse(raw) : {};
					var root = document.documentElement;
					var sharedTheme = readCookie('phh-ui-theme') || localStorage.getItem('phh-ui-theme');
					if (sharedTheme) {
						settings.theme = sharedTheme;
					}
					var sharedFont = readCookie('phh-ui-font') || localStorage.getItem('phh-ui-font');
					if (sharedFont) {
						settings.font = sharedFont;
					}
					var sharedFontSize =
						readCookie('phh-ui-font-size') || localStorage.getItem('phh-ui-font-size');
					if (sharedFontSize) {
						settings.fontSize = sharedFontSize;
					}
					if (settings.theme) {
						var theme = settings.theme;
						if (theme === 'system') {
							var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
							theme = prefersDark ? 'night' : 'winter';
						}
						root.setAttribute('data-theme', theme);
					}
					if (settings.font) {
						root.dataset.appFont = settings.font;
					}
					var sizeScales = {
						'extra-small': '0.8125',
						smaller: '0.875',
						normal: '1',
						larger: '1.125',
						'extra-large': '1.25'
					};
					var fontSize = settings.fontSize;
					if (fontSize && sizeScales[fontSize]) {
						root.dataset.appFontSize = fontSize;
						root.style.setProperty('--app-font-scale', sizeScales[fontSize]);
					}
				} catch (error) {
					/* ignore invalid stored settings */
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<script>
			/*! Early daily popup: open as soon as #daily-popup-dialog streams in (before full page/hydration). */
			(function () {
				var KEY = 'employee-portal-daily-popup-dismissed-at-v1';
				var FORCE = 'dailyPopup';
				function shouldShow(cooldownMinutes) {
					try {
						if (new URLSearchParams(location.search).get(FORCE) === '1') return true;
						var raw = localStorage.getItem(KEY);
						if (!raw) return true;
						var t = Date.parse(raw);
						if (Number.isNaN(t)) return true;
						var mins = Math.max(1, Math.min(1440, Math.round(Number(cooldownMinutes) || 15)));
						return Date.now() - t >= mins * 60000;
					} catch (e) {
						return true;
					}
				}
				function openDaily(d) {
					if (!d || d.open || d.getAttribute('data-opened') === '1') return;
					if (!shouldShow(d.getAttribute('data-cooldown'))) return;
					try {
						d.showModal();
						d.setAttribute('data-opened', '1');
					} catch (e) {}
				}
				var existing = document.getElementById('daily-popup-dialog');
				if (existing) {
					openDaily(existing);
					return;
				}
				var obs = new MutationObserver(function () {
					var d = document.getElementById('daily-popup-dialog');
					if (d) {
						openDaily(d);
						obs.disconnect();
					}
				});
				obs.observe(document.documentElement, { childList: true, subtree: true });
				setTimeout(function () {
					obs.disconnect();
				}, 15000);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
